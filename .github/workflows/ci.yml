name: CI

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Least privilege for GITHUB_TOKEN. Every job here only reads the repo: the
# artifact and cache actions authenticate with ACTIONS_RUNTIME_TOKEN, not this
# one, so nothing needs write access. Without this block the workflow inherits
# the repository default, which on a pull_request trigger can be far broader
# than anything these jobs do.
permissions:
    contents: read

env:
    EMSDK_VERSION: '3.1.61'
    # GitHub-hosted runners have no GPU. The WebGL2 TSL backend never finishes
    # loading under SwiftShader (see AGENTS.md), so harnesses that probe
    # `?webgpu` report and skip that profile instead of hanging on it.
    DICE_CI_NO_WEBGPU: '1'

# Every job below carries an explicit timeout-minutes. GitHub's default is
# SIX HOURS, and a hung Playwright harness used to burn all of it (twice per
# run). Actions has no workflow-level default for this, so it is per job:
# 15 minutes by default, 20 where a lint pass rides along (test-solver), and 30
# for the three that legitimately take longer (emcc build, render capture, and
# the CMake parity build, which links both wasm profiles twice).

jobs:
    build-js:
        name: Build (vite)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            # This job doesn't build WASM (build-wasm runs in parallel, not as
            # a dependency, to keep this job fast) — the bundle/lint-shaped
            # checks below don't need real physics.
            - run: npm run build:js:allow-missing-wasm
            - run: npm run check:bundle-size
            - run: npm run check:deploy-size
            - run: npm run check:cycles
            - run: npm run check:core-engine
            - run: npm run test:unit:coverage
            - run: npm run audit:prop-colliders
            - run: npm run verify:renderer-factory

    bundle-loading:
        name: Verify (lazy chunk loading)
        needs: build-wasm
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Download WASM artifacts
              uses: actions/download-artifact@v7
              with:
                  name: wasm-artifacts
                  # The upload below lists two paths, so upload-artifact roots
                  # the archive at their least common ancestor (`public/`) and
                  # the entries are `wasm/…` + `wasm-scalar/…`. Extracting to
                  # `.` therefore put them at the repo root, where nothing
                  # looks: every browser harness 404'd, and the checks that
                  # probe for the files (native<->WASM parity, the solver
                  # golden, this PR's tower-drop replay) skipped and reported
                  # green. Extract under `public/` so the paths round-trip.
                  path: public
            - run: npm run build:js
            - run: npx playwright install --with-deps chromium
            - run: npm run verify:bundle-loading

    pwa-isolation:
        name: Verify (PWA + crossOriginIsolated)
        needs: build-js
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run build:js:allow-missing-wasm
            - run: npx playwright install --with-deps chromium
            - run: npm run verify:pwa-isolation

    typecheck:
        name: Typecheck (tsc --noEmit)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm run typecheck:strict

    lint:
        name: Lint (ESLint + Prettier)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check

    build-wasm:
        name: Build (WASM / emcc)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
            - uses: mymindstorm/setup-emsdk@v15
              with:
                  version: ${{ env.EMSDK_VERSION }}
                  actions-cache-folder: emsdk-cache
            - run: npm run build:wasm
            - run: bash scripts/verify-emcc-flags-sync.sh
            - run: BENCH_SOLVER=1 npm run test:solver
            - run: node scripts/bench-solver-wasm.mjs | tee bench-results.txt
            - run: node scripts/compare-solver-bench.mjs bench-results.txt
            - run: node scripts/compare-solver-simd.mjs
            # Both dirs: the runtime picks scalar-vs-SIMD at load time and
            # probes `wasm-scalar/dice_physics.js`. Shipping only `wasm/` left
            # a 404 in the console of every browser job, which the harnesses
            # (correctly) treat as a failure.
            - uses: actions/upload-artifact@v6
              with:
                  name: wasm-artifacts
                  path: |
                      public/wasm/
                      public/wasm-scalar/
                  retention-days: 7
            - uses: actions/upload-artifact@v6
              with:
                  name: solver-bench
                  path: bench-results.txt
                  retention-days: 7

    test-solver:
        name: Native solver unit + fuzz + clang-tidy
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v5
            # build_solver_test.sh compiles with -Werror and, as a side effect,
            # writes src/wasm/build-native/compile_commands.json — which the
            # clang-tidy step below analyses against. Keep that order.
            - run: FUZZ_SEEDS=2000 npm run test:solver
            - name: Install clang-tidy
              run: |
                  if ! command -v clang-tidy >/dev/null 2>&1; then
                    sudo apt-get update
                    sudo apt-get install -y clang-tidy
                  fi
                  clang-tidy --version
            - run: npm run lint:cpp

    # CMake is the database clangd and IDE tooling read, build.sh is what ships.
    # This job proves they are the same build: it configures CMake through
    # emcmake and byte-diffs its dice_physics.wasm against build.sh's, then
    # publishes the merged (native + emcc) compile_commands.json so the
    # __EMSCRIPTEN__ / __wasm_simd128__ branches are covered by something other
    # than a developer's local checkout.
    wasm-toolchain:
        name: WASM toolchain (CMake parity + clangd DB)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
            - uses: mymindstorm/setup-emsdk@v15
              with:
                  version: ${{ env.EMSDK_VERSION }}
                  actions-cache-folder: emsdk-cache
            # Configure-only for the emcc half; also runs the native solver
            # build for the native half. Cheap relative to the parity build, so
            # it goes first and the artifact survives a parity failure.
            - name: Merge clangd compile database (native + emcc)
              run: npm run wasm:clangd-db
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: clangd-compile-commands
                  path: src/wasm/compile_commands.json
                  if-no-files-found: error
                  retention-days: 7
            # Builds both profiles twice (build.sh, then CMake) and cmp's the
            # .wasm files. See scripts/verify-cmake-wasm-parity.sh for what a
            # mismatch means and how to read its diagnostic.
            - name: CMake ↔ build.sh byte parity
              run: npm run verify:cmake-wasm

    test-solver-wasm-parity:
        name: Native ↔ WASM serialize parity
        needs: build-wasm
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5
            - name: Download WASM artifacts
              uses: actions/download-artifact@v7
              with:
                  name: wasm-artifacts
                  # The upload below lists two paths, so upload-artifact roots
                  # the archive at their least common ancestor (`public/`) and
                  # the entries are `wasm/…` + `wasm-scalar/…`. Extracting to
                  # `.` therefore put them at the repo root, where nothing
                  # looks: every browser harness 404'd, and the checks that
                  # probe for the files (native<->WASM parity, the solver
                  # golden, this PR's tower-drop replay) skipped and reported
                  # green. Extract under `public/` so the paths round-trip.
                  path: public
            - run: npm run test:solver

    # These verify:* scripts each boot their own throwaway vite dev server
    # (see tests/helpers/server.js), so no separate preview server is needed here.
    verify:
        name: Verify (${{ matrix.script }})
        needs: build-wasm
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                script:
                    - verify:worker-physics
                    - verify:worker-replay
                    - verify:tower-drop-replay
                    - verify:godrays
                    - verify:wasm-primitives
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Download WASM artifacts
              uses: actions/download-artifact@v7
              with:
                  name: wasm-artifacts
                  # The upload below lists two paths, so upload-artifact roots
                  # the archive at their least common ancestor (`public/`) and
                  # the entries are `wasm/…` + `wasm-scalar/…`. Extracting to
                  # `.` therefore put them at the repo root, where nothing
                  # looks: every browser harness 404'd, and the checks that
                  # probe for the files (native<->WASM parity, the solver
                  # golden, this PR's tower-drop replay) skipped and reported
                  # green. Extract under `public/` so the paths round-trip.
                  path: public
            - run: ls -la public/wasm public/wasm-scalar || true
            - run: npx playwright install --with-deps chromium
            - run: npm run ${{ matrix.script }}

    # The tests/*.js scripts (unlike scripts/verify-*.mjs) expect an already-running
    # server on :4173, so this job builds once and starts a shared preview server.
    verify-tests:
        name: Verify (${{ matrix.script }})
        needs: build-wasm
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                script:
                    - test:lamp
                    - test:cauldron
                    - test:flute
                    - test:playingcards
                    - test:breadloaf
                    - test:dicecup
                    - test:wasm-authoritative
                    - test:wasm-gameplay-loop
                    - test:share-roll-replay
                    - test:a11y
                    - test:mobile-touch
                    - verify:clutter-unification
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Download WASM artifacts
              uses: actions/download-artifact@v7
              with:
                  name: wasm-artifacts
                  # The upload below lists two paths, so upload-artifact roots
                  # the archive at their least common ancestor (`public/`) and
                  # the entries are `wasm/…` + `wasm-scalar/…`. Extracting to
                  # `.` therefore put them at the repo root, where nothing
                  # looks: every browser harness 404'd, and the checks that
                  # probe for the files (native<->WASM parity, the solver
                  # golden, this PR's tower-drop replay) skipped and reported
                  # green. Extract under `public/` so the paths round-trip.
                  path: public
            - run: ls -la public/wasm public/wasm-scalar || true
            - run: npx playwright install --with-deps chromium
            - run: npm run build:js
            # --host 127.0.0.1 is load-bearing: with no --host, vite binds
            # whatever `localhost` resolves to, which is [::1] on GitHub
            # runners, and the 127.0.0.1 probe below can never connect.
            - name: Start preview server on :4173
              run: |
                  npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
                  for i in $(seq 1 60); do
                    curl -sf http://127.0.0.1:4173/ > /dev/null && exit 0
                    sleep 1
                  done
                  echo "preview server did not come up" >&2
                  exit 1
            - run: npm run ${{ matrix.script }}

    render-regression:
        name: Render regression (webgl baselines enforced; webgpu soft-fail)
        needs: build-wasm
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Download WASM artifacts
              uses: actions/download-artifact@v7
              with:
                  name: wasm-artifacts
                  # The upload below lists two paths, so upload-artifact roots
                  # the archive at their least common ancestor (`public/`) and
                  # the entries are `wasm/…` + `wasm-scalar/…`. Extracting to
                  # `.` therefore put them at the repo root, where nothing
                  # looks: every browser harness 404'd, and the checks that
                  # probe for the files (native<->WASM parity, the solver
                  # golden, this PR's tower-drop replay) skipped and reported
                  # green. Extract under `public/` so the paths round-trip.
                  path: public
            - run: npx playwright install --with-deps chromium
            # Required profiles (?webgl&no-post, ?webgl) must capture and match
            # tests/baselines/. The optional ?webgpu capture is skipped on CPU CI
            # (DICE_CI_NO_WEBGPU=1) since it can never complete there.
            - name: Capture golden frames
              run: node scripts/render-regression.mjs
            - name: Compare against stored baselines (tests/baselines/)
              run: node scripts/compare-render-baseline.mjs
            - name: Upload screenshots
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: render-regression-screenshots
                  path: render-regression-*.png
                  if-no-files-found: ignore
                  retention-days: 7
