<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
        <link rel="icon" type="image/png" sizes="192x192" href="./pwa-192x192.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#1a0f08" />
        <meta
            name="description"
            content="3D tavern dice roller with realistic physics — roll offline in your browser."
        />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <link rel="apple-touch-icon" href="./pwa-192x192.png" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Tavern Dice Roller" />
        <meta
            property="og:description"
            content="Throw d4–d20 across a candlelit tavern table with real rigid-body physics, in your browser."
        />
        <meta property="og:image" content="./pwa-512x512.png" />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="Tavern Dice Roller" />
        <meta
            name="twitter:description"
            content="Throw d4–d20 across a candlelit tavern table with real rigid-body physics, in your browser."
        />
        <title>WebGPU Dice Roller</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                width: 100%;
                height: 100%;
                background: #0a0a0a;
                overflow: hidden;
            }
            body {
                margin: 0;
            }
            #canvas-container {
                position: relative;
                width: 100%;
                height: 100%;
                max-width: 100vw;
                max-height: 100vh;
            }
            /* Optional centered square layout, opt-in via ?square. */
            body.layout-square {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            body.layout-square #canvas-container {
                width: min(100vw, 100vh, 1024px);
                height: min(100vw, 100vh, 1024px);
                aspect-ratio: 1 / 1;
            }
            #canvas-container canvas {
                display: block;
                width: 100% !important;
                height: 100% !important;
            }
            /* HUD panel look-and-feel (tokens, .visually-hidden, focus rings) lives in
               src/ui/hud.css, imported by main.js — not duplicated here. */
        </style>
    </head>
    <body>
        <div
            id="loading-overlay"
            style="
                position: fixed;
                inset: 0;
                background: #111;
                color: #ccc;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 9999;
                font-family: sans-serif;
            "
        >
            <div id="loading-text" style="font-size: 1.5rem; margin-bottom: 1rem">
                Loading Tavern...
            </div>
            <div style="width: 300px; height: 8px; background: #333; border-radius: 4px">
                <div
                    id="loading-bar"
                    style="
                        width: 0%;
                        height: 100%;
                        background: #ff9933;
                        border-radius: 4px;
                        transition: width 0.2s;
                    "
                ></div>
            </div>
        </div>
        <div id="canvas-container"></div>
        <script>
            (function () {
                // Full-window by default; the boxed square view is opt-in only
                // (?square) — as a desktop default it letterboxed the scene.
                if (new URLSearchParams(location.search).has('square')) {
                    document.body.classList.add('layout-square');
                }
            })();
        </script>
        <noscript>
            <p
                style="
                    position: fixed;
                    inset: 0;
                    z-index: 10000;
                    background: #111;
                    color: #ccc;
                    padding: 2rem;
                    font-family: sans-serif;
                "
            >
                The tavern dice roller needs JavaScript. Please enable it and reload.
            </p>
        </noscript>
        <script>
            // Boot watchdog (#383). The app's own error boundary (src/core/ErrorBoundary.ts)
            // takes over once the entry module has run and sets window.__diceBooted; this
            // covers what happens before that: the entry script 404s (stale deploy), a
            // module throws while evaluating, or the page just never gets going.
            (function () {
                function fail(message, stalled) {
                    // After the entry ran, its own boundary reports errors; only a stall is ours.
                    if (window.__diceBooted && !stalled) return;
                    var text = document.getElementById('loading-text');
                    if (!text || text.dataset.failed) return;
                    text.dataset.failed = '1';
                    text.textContent = message;
                    var bar = document.getElementById('loading-bar');
                    if (bar) bar.style.background = '#a33';
                    var btn = document.createElement('button');
                    btn.type = 'button';
                    btn.textContent = 'Reload';
                    btn.style.cssText =
                        'margin-top:1.25rem;font:inherit;padding:8px 18px;cursor:pointer;border-radius:4px;border:1px solid #ff9933;background:#ff9933;color:#1a0f08';
                    btn.onclick = function () {
                        location.reload();
                    };
                    text.parentNode.appendChild(btn);
                }
                // Capture phase: a failed <script>/<link> reports on the element, not on window.
                window.addEventListener(
                    'error',
                    function (e) {
                        var t = e.target;
                        if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
                            fail('The app could not load. Check your connection and reload.');
                        } else if (e.error) {
                            fail('The app failed to start.');
                        }
                    },
                    true
                );
                // ?no-wasm / slow networks legitimately take a while: only a hard stall counts.
                setTimeout(function () {
                    if (document.getElementById('loading-overlay')) {
                        fail('Still loading… the app is taking much longer than usual.', true);
                    }
                }, 90000);
            })();
        </script>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
